<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Help — table tent card (print)</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="print.css" />
  <style>
    @page { size: letter landscape; margin: 0.4in; }
    .sheet.landscape {
      width: 11in;
      min-height: 8.5in;
      padding: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      text-align: left;
      padding: 0.38in 0.5in 0.32in;
      overflow: hidden;
    }
    .panel.top {
      transform: rotate(180deg);
      border-bottom: 1px dashed var(--ink);
    }
    .who {
      margin: 0;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    .panel h1 {
      margin: 0.15in 0 0;
      font-size: 4.8rem;
      line-height: 0.76;
    }
    .meta {
      margin: 0;
      font-family: var(--mono);
      font-size: 1rem;
    }
    .fold-note { font-family: var(--mono); font-size: 0.8rem; text-align: left; max-width: 11in; margin: 0.3rem auto 1rem; }
    @media print {
      .sheet.landscape { width: auto; min-height: auto; height: 7.2in; }
      .panel h1 { font-size: 4rem; }
    }
    @media screen and (max-width: 760px) {
      .sheet.landscape { width: auto; min-height: 0; display: block; }
      .panel { min-height: 70vh; }
      .panel h1 { font-size: 4rem; }
    }
  </style>
</head>
<body>

<div class="toolbar" style="max-width:11in"><button onclick="window.print()">Print</button>Landscape letter. Print, fold along the dashed line, stand it on the table. Top half is upside‑down on purpose.</div>

<article class="sheet landscape">
  <section class="panel top">
    <p class="who">Tech Help</p>
    <h1>Sit<br>down.</h1>
    <p class="meta">About 10 minutes in the clubhouse. Free.</p>
  </section>
  <section class="panel bottom">
    <p class="who">Tech Help</p>
    <h1>Sit<br>down.</h1>
    <p class="meta">About 10 minutes in the clubhouse. Free.</p>
  </section>
</article>

<p class="fold-note screen-only">Fold along the dashed line · techhelp.now</p>

</body>
</html>
